# ProjectileGuard - Paper/Spigot 1.21.11
# Only projectiles shot by players are protected.
# Dropped Item entities are intentionally NOT touched.

check-interval-ticks: 1
prevent-natural-despawn: true
prevent-plugin-removal: true
adopt-existing-player-projectiles: true

protected-projectiles:
  - ARROW
  - SPECTRAL_ARROW
  - TRIDENT
  - FIREBALL
  - SMALL_FIREBALL
  - LARGE_FIREBALL
  - DRAGON_FIREBALL
  - WITHER_SKULL
  - WIND_CHARGE
  - BREEZE_WIND_CHARGE
  - SNOWBALL
  - EGG
  - ENDER_PEARL
  - EXPERIENCE_BOTTLE
  - SPLASH_POTION
  - LINGERING_POTION
  - FIREWORK_ROCKET
  - LLAMA_SPIT
  - SHULKER_BULLET
