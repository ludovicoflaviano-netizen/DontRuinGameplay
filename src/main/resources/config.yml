# DontRuinGameplay - Paper 1.21.11
# Only projectiles whose shooter is a player are protected.
# Dropped Item entities are never modified by this plugin.

scan-interval-ticks: 1
prevent-natural-despawn: true
recover-plugin-removal: true
adopt-existing-player-projectiles: true

protected-projectiles:
  - ARROW
  - SPECTRAL_ARROW
  - TRIDENT
  - FIREBALL
  - SMALL_FIREBALL
  - LARGE_FIREBALL
  - DRAGON_FIREBALL
  - WITHER_SKULL
  - WIND_CHARGE
  - BREEZE_WIND_CHARGE
  - SNOWBALL
  - EGG
  - ENDER_PEARL
  - EXPERIENCE_BOTTLE
  - SPLASH_POTION
  - LINGERING_POTION
  - FIREWORK_ROCKET
  - LLAMA_SPIT
  - SHULKER_BULLET
  - FISHING_BOBBER
